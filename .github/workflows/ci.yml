name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Droits minimaux : la CI ne fait que lire le dépôt
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Hooks pre-commit et contrôles de base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer pre-commit
        run: pip install -r requirements-dev.txt

      # Mêmes hooks qu'en local. no-commit-to-branch est ignoré : sur un push vers main
      # il échouerait toujours, alors qu'il ne sert qu'aux commits locaux.
      - name: Hooks pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch

      - name: Syntaxe du script
        run: python -m py_compile src/pipeline.py

      - name: Notebook en JSON valide
        run: python -c "import json; json.load(open('notebooks/P8_notebook.ipynb', encoding='utf-8'))"

  unit-tests:
    name: Tests unitaires (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      # Environnement volontairement léger : ni Spark ni TensorFlow, les tests n'en ont pas besoin
      - name: Installer les dépendances de test
        run: pip install -r requirements-test.txt

      - name: Tests unitaires
        run: python -m pytest

  secrets:
    name: Recherche de secrets (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
